<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-21 // ROUTE PLANNER</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-left">
        <div>
            <h1>M-21 // TERMINAL_V5</h1>
            <div style="font-size: 0.85rem; color: #aaa;">SYSTEM: STANTON | LOCAL OVERRIDE: ACTIVE</div>
        </div>
        <img src="assets\logo.jpg" alt="Logo" class="terminal-logo">
        <img src="assets/made-by-community.png" alt="Made by the Community" class="terminal-logo community-logo">
    </div>
    <div id="sys-time">SYS_CLK: 00:00:00</div>
</header>

<div class="main-container">
    <div class="control-panel">
        <div class="panel-section route-manager-section">
            <label>ACTIVE ROUTE:</label>
            <div class="route-select-row">
                <select id="route-select"></select>
                <button id="new-route-btn" class="icon-btn" title="New Route">[+]</button>
                <button id="delete-route-btn" class="icon-btn danger" title="Delete Route">[X]</button>
            </div>
            <input type="text" id="route-name-input" class="route-name-input" placeholder="ROUTE NAME">
        </div>

        <div class="panel-section">
            <label>SHIP IDENTIFICATION:</label>
            <select id="ship-select"></select>
            
            <label style="margin-top: 10px;">QUANTUM DRIVE UNIT:</label>
            <select id="drive-select"></select>
        </div>

        <div class="panel-section">
            <label>SELECT NAV POINT:</label>
            <select id="location-select"></select>
            <button id="add-stop-btn">+ APPEND TO ROUTE</button>
        </div>

        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;" class="route-panel">
            <label style="margin-bottom: 10px;">ACTIVE FLIGHT PLAN: <span id="active-route-label"></span></label>
            <div class="route-list" id="route-list"></div>
            <div class="total-dist" id="total-dist">TOTAL: 0.00 Gm</div>
        </div>

        <div class="fuel-status-container">
            <div class="label-row">
                <span>FUEL_RESERVES // -0.1_SCUs_QT_Capacity</span>
                <span id="fuel-percent">100%</span>
            </div>
            <div class="fuel-bar-bg">
                <div id="fuel-bar-fill"></div>
            </div>
            <div id="route-warnings"></div>
        </div>

        <div>
            <button id="sim-btn">[ ▶ SIMULATE FLIGHT ]</button>
            <button class="danger" id="clear-route-btn">[ PURGE FLIGHT PLAN ]</button>
        </div>
    </div>

    <div class="map-container">
        <canvas id="mapCanvas"></canvas>
        <div class="map-hud">
            <div id="focus-label" class="focus-label" style="display:none;"></div>
            <button id="back-to-map-btn" class="back-btn" style="display:none;">[ ◀ BACK TO SYSTEM MAP ]</button>
        </div>
        <div class="ambient-top-stack">
            <div class="ambient-panel ambient-scan-panel">
                <div class="ambient-panel-header">SEC_SCAN // AUX_FEED</div>
                <div class="ambient-panel-body" id="scan-panel-body"></div>
            </div>
            <div class="ambient-panel ambient-waveform-panel">
                <div class="ambient-panel-header">SCAN WAVE // SONAR RETURN</div>
                <canvas id="scan-waveform-canvas" class="ambient-waveform-canvas"></canvas>
            </div>
        </div>
        <div class="ambient-bottom-stack">
            <div class="ambient-panel ambient-bounty-panel">
                <div class="ambient-panel-header">BOUNTY / THREAT BOARD</div>
                <div class="ambient-bounty-body" id="bounty-panel-body"></div>
            </div>
            <div class="ambient-panel ambient-news-panel">
                <div class="ambient-panel-header">STANTON WIRE // NEWS_FEED</div>
                <div class="ambient-panel-body" id="news-panel-body"></div>
            </div>
        </div>
        <div id="flicker-overlay" class="crt-flicker-overlay"></div>
    </div>
</div>

<script src="./data/locations.js"></script>
<script src="./data/quantumdrives.js"></script>
<script src="./data/ships.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
